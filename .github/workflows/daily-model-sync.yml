name: Daily Model Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync models and docs (strict)
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WECHAT_QYAPI_ID: ${{ secrets.WECHAT_QYAPI_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # --strict: provider 失败或增减超阈值 → 退出码 2.
        # 正常日直接 commit 回 master, 保证次日的 diff 基线就是今天的存量;
        # 异常日仍写数据并通知, 但走下方 PR 审核路径, 不无人值守落 master.
        run: |
          set +e
          npm run sync-models -- --strict
          status=$?
          set -e
          npm run generate-docs
          exit $status

      - name: Commit and push changes (clean run)
        if: steps.sync.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: daily model sync'
          file_pattern: 'data README.md docs/providers v1'

      - name: Open PR with changes (anomalous run)
        if: steps.sync.outcome != 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: daily model sync (anomalies detected)'
          title: 'chore: daily model sync — 异常待审核'
          body: |
            Daily sync detected anomalies (provider failures or >50% swings), so these changes were **not** committed to master directly.

            Review the diff for unexpected model removals before merging.
          branch: bot/daily-model-sync
          base: master
          delete-branch: true
          add-paths: |
            data
            v1
            README.md
            docs/providers
